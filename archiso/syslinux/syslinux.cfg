UI vesamenu.c32

MENU TITLE GuNix OS
MENU BACKGROUND splash.png
MENU COLOR title * #FFFFFFFF *
MENU COLOR border * #00000000 #00000000 none
MENU COLOR sel 30;47 #ffffffff #ff173161 *

TIMEOUT 150

DEFAULT gunix64

LABEL gunix64
    MENU LABEL GuNix OS (x86_64)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=GUNIX_%INSTALL_DIR%

LABEL gunix64_nomodeset
    MENU LABEL GuNix OS (x86_64, nomodeset)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=GUNIX_%INSTALL_DIR% nomodeset

LABEL verify
    MENU LABEL Verify signature and boot GuNix OS (x86_64)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=GUNIX_%INSTALL_DIR% verify=y
